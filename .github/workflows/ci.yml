name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-production-secret-52cf5704dfd34baf
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python bacend/manage.py check
      - run: python bacend/manage.py test accounts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bacend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bacend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
